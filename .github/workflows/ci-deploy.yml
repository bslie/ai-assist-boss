name: CI and deploy

on:
  push:
    branches: [master, ci/deploy-pipeline]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/ai-assist-boss

jobs:
  test:
    name: Type check and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_assist_boss_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_assist_boss_test
      REDIS_URL: redis://localhost:6379
      CONNECTOR_SECRET: ci-only-connector-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ai-assist-boss:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke check that the image starts Next.js
        run: |
          docker run --rm --entrypoint node ai-assist-boss:ci -e "console.log(require('next/package.json').version)"

  deploy:
    name: Deploy to bench
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload the committed tree
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # git archive ships only tracked files. tar -x overwrites those paths and
          # does not delete server-only files (.env, docker-compose.harden.yml).
          git archive --format=tar HEAD | ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "mkdir -p $DEPLOY_DIR && tar -x -C $DEPLOY_DIR"
      - name: Build and restart containers
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Same -f list for every compose command so they target one project.
          # docker-compose.harden.yml lives only on the server and stays out of git.
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "cd \"$DEPLOY_DIR\" && sh -s" <<'EOF'
          set -- -f docker-compose.prod.yml
          if [ -f docker-compose.harden.yml ]; then
            set -- "$@" -f docker-compose.harden.yml
          fi
          docker compose "$@" up -d --build --remove-orphans
          EOF
      - name: Health check
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for _ in $(seq 1 20); do
            if ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "curl -fsS -o /dev/null http://127.0.0.1:3000/"; then
              echo "App is up"; exit 0
            fi
            sleep 6
          done
          echo "App did not become healthy"; exit 1
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
